title = "Gitleaks classroom rules"

[extend]
useDefault = true

[[rules]]
id = "classroom-aws-example"
description = "Published AWS example used in the classroom"
path = '''(^|/)config\.py$'''
regex = '''(?m)^AWS_ACCESS_KEY_ID\s*=\s*"(AKIAIOSFODNN7EXAMPLE)"'''
secretGroup = 1
[[rules]]
id = "kazi-fictional-service-key"
description = "Detect fictional Kazi service keys"
path = '''(^|/)config\.py$'''
regex = '''\bKAZI-KEY-[0-9]{6}\b'''
